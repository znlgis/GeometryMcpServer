# Geometry MCP Server Configuration

# Server settings
server.port=8080
spring.application.name=geometry-mcp-server

# MCP transport mode (http or stdio)
mcp.transport=http

# GIS Storage settings
gis.storage.path=./data
gis.export.path=./exports
gis.server.baseUrl=http://localhost:8080

# Database settings (H2 for development)
spring.datasource.url=jdbc:h2:file:./data/gis-db
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
# Empty password is intentional for local development with H2
spring.datasource.password=

# JPA settings
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 Console (for development)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Logging
logging.level.com.github.znlgis.gis=INFO
logging.level.org.springframework=WARN
